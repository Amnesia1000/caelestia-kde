<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 144 128" width="288" height="256">
  <defs>
    <!-- Filter for white swoosh shadow -->
    <filter id="whiteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Filter for teal swoosh shadow -->
    <filter id="tealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Filter for KDE badge shadow -->
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Vibrant teal gradient for upper swoosh -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ea8a4" />
      <stop offset="50%" stop-color="#5ec5be" />
      <stop offset="100%" stop-color="#7feae1" />
    </linearGradient>

    <!-- Crisp white gradient for lower swoosh -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f3f6" />
    </linearGradient>

    <!-- Stars cyan gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8bf4ec" />
      <stop offset="100%" stop-color="#55c1b9" />
    </linearGradient>

    <!-- KDE Plasma Blue gradient -->
    <linearGradient id="kdeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4faae8" />
      <stop offset="50%" stop-color="#3188d3" />
      <stop offset="100%" stop-color="#1c66b8" />
    </linearGradient>
  </defs>

  <style>
    #logo-blur {
      animation: logo-blur 900ms cubic-bezier(0.215, 0.61, 0.355, 1) 0ms both;
    }

    #logo-opacity {
      animation: fade-in 600ms cubic-bezier(0.455, 0.03, 0.515, 0.955) 0ms both;
    }

    #logo-scale {
      transform-origin: 64px 45.19px;
      animation: logo-scale 1550ms linear 0ms both;
    }

    #logo-rotate {
      transform-origin: 64px 45.19px;
      animation: logo-rotate 1900ms linear 0ms both;
    }

    #star1-intro {
      transform-origin: 64px 45.19px;
      animation:
        fade-in 700ms cubic-bezier(0.455, 0.03, 0.515, 0.955) 1100ms both,
        star-pop 900ms linear 1100ms both;
    }

    #star2-intro {
      transform-origin: 64px 45.19px;
      animation:
        fade-in 700ms cubic-bezier(0.455, 0.03, 0.515, 0.955) 1250ms both,
        star-pop 900ms linear 1250ms both;
    }

    #star3-intro {
      transform-origin: 64px 45.19px;
      animation:
        fade-in 700ms cubic-bezier(0.455, 0.03, 0.515, 0.955) 1400ms both,
        star-pop 900ms linear 1400ms both;
    }

    #star1-float {
      transform-origin: 64px 45.19px;
      animation: star1-float 5000ms cubic-bezier(0.455, 0.03, 0.515, 0.955) 2500ms infinite;
    }

    #star2-float {
      transform-origin: 64px 45.19px;
      animation: star2-float 6000ms cubic-bezier(0.455, 0.03, 0.515, 0.955) 2500ms infinite;
    }

    #star3-float {
      transform-origin: 64px 45.19px;
      animation: star3-float 5600ms cubic-bezier(0.455, 0.03, 0.515, 0.955) 2500ms infinite;
    }

    #badge-anim {
      transform-origin: 20.5px 20.5px;
      animation:
        fade-in 600ms cubic-bezier(0.215, 0.61, 0.355, 1) 1900ms both,
        badge-pop 600ms linear 1900ms both;
    }

    @keyframes logo-blur {
      0% { filter: blur(12px); }
      100% { filter: blur(0px); }
    }

    @keyframes fade-in {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes logo-rotate {
      0% {
        transform: rotate(0deg);
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }
      52.63% {
        transform: rotate(750deg);
        animation-timing-function: cubic-bezier(0.455, 0.03, 0.515, 0.955);
      }
      68.42% {
        transform: rotate(710deg);
        animation-timing-function: cubic-bezier(0.455, 0.03, 0.515, 0.955);
      }
      86.84% {
        transform: rotate(725deg);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      100% {
        transform: rotate(720deg);
      }
    }

    @keyframes logo-scale {
      0% {
        transform: scale(0);
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }
      64.52% {
        transform: scale(1.08);
        animation-timing-function: cubic-bezier(0.455, 0.03, 0.515, 0.955);
      }
      77.42% {
        transform: scale(0.96);
        animation-timing-function: cubic-bezier(0.42, 1.67, 0.21, 0.9);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes star-pop {
      0% {
        transform: scale(0);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      55.56% {
        transform: scale(1.08);
        animation-timing-function: cubic-bezier(0.455, 0.03, 0.515, 0.955);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes badge-pop {
      0% {
        transform: scale(0);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      66.67% {
        transform: scale(1.341684);
        animation-timing-function: cubic-bezier(0.455, 0.03, 0.515, 0.955);
      }
      100% {
        transform: scale(1.2423);
      }
    }

    @keyframes star1-float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.08); }
    }

    @keyframes star2-float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(5px) scale(1.12); }
    }

    @keyframes star3-float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.08); }
    }
  </style>

  <g id="logo-blur">
    <g id="logo-opacity">
      <g id="logo-scale">
        <g id="logo-rotate">
          <!-- bottomShape (White Swoosh) -->
          <path filter="url(#whiteShadow)" fill="url(#whiteGrad)" d="m103.02,51.8c-.65.11-1.26-.37-1.28-1.03-.06-1.96.15-3.89-.2-5.78-.28-1.48-1.66-2.5-3.16-2.34h-.05c-6.53.73-24.63,3.1-48,9.32-6.89,1.83-9.83,10-5.67,15.79,4.62,6.44,11.84,10.93,20.41,12.13,11.82,1.66,22.99-3.36,29.21-12.65.54-.81,1.54-1.17,2.47-.86.91.3,1.47,1.15,1.47,2.04,0,.33-.08.66-.24.98-7.23,14.21-22.91,22.95-39.59,20.6-7.84-1.1-14.8-4.5-20.28-9.43,0,0,0,0-.02-.01-7.28-5.14-14.7-9.99-27.24-11.98-18.82-2.98-9.53-8.75.46-13.78,7.36-3.13,25.17-7.9,36.24-10.73.16-.03.31-.06.47-.1,1.52-.4,3.2-.83,5.02-1.29,1.06-.26,1.93-.48,2.58-.64.09-.02.18-.04.26-.06.31-.08.56-.14.73-.18.03,0,.06-.01.08-.02.03,0,.05-.01.07-.02.02,0,.04,0,.06-.01.01,0,.03,0,.04-.01,0,0,.02,0,.03,0,.01,0,.02,0,.02,0,10.62-2.58,24.63-5.62,37.74-7.34,1.02-.13,2.03-.26,3.03-.37,7.49-.87,14.58-1.26,20.42-.81,25.43,1.95-4.71,16.77-15.12,18.61Z"/>

          <!-- topShape (Teal Swoosh) -->
          <path filter="url(#tealShadow)" fill="url(#tealGrad)" d="m42.56,42.96c-7.76,1.6-16.36,4.22-22.44,6.22-.49.16-.88-.44-.53-.82,5.37-5.85,9.66-13.3,9.66-13.3,8.66-14.67,22.97-23.51,39.85-21.14,6.47.91,12.33,3.38,17.26,6.98.99.72,1.14,2.14.31,3.04-.4.44-.95.67-1.51.67-.34,0-.69-.09-1-.26-3.21-1.84-6.82-2.69-10.71-3.24-13.1-1.84-25.41,4.75-31.06,15.83-.94,1.84-.61,3.81.45,5.21.22.3.07.72-.29.8Z"/>

          <!-- star1 -->
          <g id="star1-intro">
            <g id="star1-float">
              <path fill="url(#starGrad)" d="m98.12.06c-.29,2.08-1.72,8.42-8.36,9.19-.09,0-.09.13,0,.14,6.64.78,8.07,7.11,8.36,9.19.01.08.13.08.14,0,.29-2.08,1.72-8.42,8.36-9.19.09,0,.09-.13,0-.14-6.64-.78-8.07-7.11-8.36-9.19-.01-.08-.13-.08-.14,0Z"/>
            </g>
          </g>

          <!-- star2 -->
          <g id="star2-intro">
            <g id="star2-float">
              <path fill="url(#starGrad)" d="m113.36,15.5c-.22,1.29-1.08,4.35-4.38,4.87-.08.01-.08.13,0,.14,3.3.52,4.17,3.58,4.38,4.87.01.08.13.08.14,0,.22-1.29,1.08-4.35,4.38-4.87.08-.01.08-.13,0-.14-3.3-.52-4.17-3.58-4.38-4.87-.01-.08-.13-.08-.14,0Z"/>
            </g>
          </g>

          <!-- star3 -->
          <g id="star3-intro">
            <g id="star3-float">
              <path fill="url(#starGrad)" d="m112.69,65.22c-.19,1.01-.86,3.15-3.2,3.57-.08.01-.08.13,0,.14,2.34.42,3.01,2.56,3.2,3.57.01.08.13.08.14,0,.19-1.01.86-3.15,3.2-3.57.08-.01.08-.13,0-.14-2.34-.42-3.01-2.56-3.2-3.57-.01-.08-.13-.08-.14,0Z"/>
            </g>
          </g>

          <!-- badgeGroup -->
          <g transform="translate(77.08, 65.23)">
            <g id="badge-anim" filter="url(#badgeShadow)">
              <circle cx="20.5" cy="20.5" r="20.5" fill="url(#kdeBlueGrad)" stroke="white" stroke-opacity="0.35" stroke-width="0.8"/>
              <g transform="translate(-1.3667, -1.3667) scale(0.683333)">
                <path fill="white" d="m 36,11.00001 -8,1.210938 v 28.9375 L 36,39.00001 V 27.820322 l 8,13.179688 8,-3 -10,-12 L 52.003906,13.003916 44.242188,11.00001 36,24.117198 Z m -16.289062,7.847656 c -0.189184,0 -0.378371,0.07368 -0.523438,0.21875 l -3.144531,3.144532 c -0.290135,0.290134 -0.220288,0.704614 0,1.05078 l 3.253906,5.109376 c -0.241085,0.500442 -0.449846,1.01582 -0.625,1.542968 -0.0077,0.02268 -0.01978,0.04368 -0.02734,0.0664 l -5.902344,1.3125 C 12.341647,31.381998 12,31.624856 12,32.035166 v 1.964844 1.964844 c 0,0.41031 0.341647,0.65318 0.742188,0.742188 l 5.902343,1.3125 c 0.01292,0.0388 0.03357,0.07462 0.04687,0.11328 0.17049,0.512084 0.372704,1.013054 0.605469,1.5 l -3.253906,5.10547 c -0.220288,0.346166 -0.290135,0.760646 0,1.05078 l 3.144532,3.144532 c 0.290135,0.290134 0.756735,0.290134 1.046876,0 l 5.101562,-3.25 c 0.501518,0.243898 1.01821,0.455272 1.546874,0.632812 0.0347,0.0122 0.06678,0.03108 0.10156,0.04296 l 1.308592,5.898436 C 28.29296,52.668124 28.62484,53 29.035148,53 h 4.441406 c 0.41031,0 0.65318,-0.341648 0.742188,-0.742188 l 1.308594,-6.078124 c 0.601208,-0.226026 1.184836,-0.496298 1.746094,-0.808594 l 4.980468,3.5625 c 0.290136,0.290134 0.756742,0.290134 1.046876,0 l 3.14453,-3.144532 c 0.290136,-0.290134 0.220288,-0.704614 0,-1.05078 l -1.89453,-2.875 -0.19922,0.07422 c -0.450502,0.16922 -0.95765,-0.0064 -1.20703,-0.417968 l -1.99218,-3.281242 C 39.492472,42.208682 35.572478,45.00001 31,45.00001 c -6.075132,0 -11,-4.924868 -11,-11 0,-4.66184 2.905598,-8.6367 7,-10.238282 v -2.191406 l -0.0156,0.07032 c -0.04416,0.015 -0.0849,0.03914 -0.1289,0.05468 -0.52165,0.17324 -1.03179,0.379376 -1.527344,0.617188 l -5.09378,-3.246094 c -0.145072,-0.145067 -0.334254,-0.21875 -0.523438,-0.21875 z"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
